<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar acceso · Holyrics</title><link rel="stylesheet" href="/public/css/app.css"><link rel="stylesheet" href="/public/css/compact.css"></head><body><main class="login-wrap"><section class="card login-card"><h1>Autorizar este dispositivo</h1><p>Escribe un nombre que permita reconocer este móvil o computadora. La aplicación de Windows recibirá la solicitud y deberá aceptarla.</p><form id="accessForm" class="stack"><label class="field"><span>Nombre del dispositivo</span><input id="deviceName" class="control" maxlength="48" autocomplete="device-name" placeholder="Ej.: Tablet del escenario" required></label><label class="field"><span>Contraseña adicional, si está configurada</span><input id="extraPassword" class="control" type="password" autocomplete="current-password" placeholder="Opcional"></label><button id="requestButton" class="btn primary" type="submit">Solicitar acceso</button></form><div id="requestState" class="info-box" hidden></div><div id="accessError" class="muted tiny" role="status" style="margin-top:12px"></div></section></main><script type="module" src="/public/js/access.js"></script></body></html>
